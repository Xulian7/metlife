{% extends "base.html" %}
{% block content %}
<section class="hero"><h1>Seguros y protección</h1></section>
<section class="panel">
  {% for diagnostico in diagnosticos %}
    <p><strong>{{ diagnostico.cliente }}</strong> - brecha {{ diagnostico.brecha_proteccion }}</p>
  {% empty %}
    <p>Sin diagnósticos de protección.</p>
  {% endfor %}
</section>
{% endblock %}
