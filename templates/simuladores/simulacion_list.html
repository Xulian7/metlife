{% extends "base.html" %}
{% block content %}
<section class="hero"><div><p class="eyebrow">Motor auditable</p><h1>Simulaciones</h1></div></section>
<section class="panel">{% for simulacion in simulaciones %}<p><strong>{{ simulacion.cliente }}</strong> - {{ simulacion.tipo }} - motor {{ simulacion.version_motor }}<br><small>{{ simulacion.normativa_version }}</small></p>{% empty %}<p>Sin simulaciones.</p>{% endfor %}</section>
{% endblock %}
